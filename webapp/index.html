<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101112">
  <title>Библия на каждый день</title>
  <script src="https://telegram.org/js/telegram-web-client.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app">
    <div class="topbar">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none"><path d="M7 11.5c6.2-3.2 11.8-2.3 17 2.1v25.1c-5.2-4.4-10.8-5.3-17-2.1V11.5Z" stroke="currentColor" stroke-width="2.2"/><path d="M41 11.5c-6.2-3.2-11.8-2.3-17 2.1v25.1c5.2-4.4 10.8-5.3 17-2.1V11.5Z" stroke="currentColor" stroke-width="2.2"/><path d="M24 9v28M29 5v8M25 9h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </div>
      <div>
        <div class="eyebrow">ЕЖЕДНЕВНОЕ ЧТЕНИЕ</div>
        <div class="brand-title">Библия на каждый день</div>
      </div>
      <button id="refresh" class="icon-button" aria-label="Обновить">↻</button>
    </div>

    <main id="content" class="content">
      <div class="skeleton hero-skeleton"></div>
      <div class="skeleton line"></div>
      <div class="skeleton card-skeleton"></div>
    </main>

    <nav class="bottom-nav" aria-label="Навигация">
      <button class="nav-item active" data-page="today"><span>⌂</span><small>Сегодня</small></button>
      <button class="nav-item" data-page="progress"><span>◒</span><small>Прогресс</small></button>
      <button class="nav-item" data-page="history"><span>⌁</span><small>История</small></button>
      <button class="nav-item" data-page="more"><span>•••</span><small>Ещё</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <section class="modal-sheet" role="dialog" aria-modal="true">
      <button id="close-modal" class="modal-close">×</button>
      <div id="modal-body"></div>
    </section>
  </div>

  <script src="client.js"></script>
</body>
</html>
